[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=4,12,24,220

[Variables]
FontTitle=Orbitron
FontMono=Consolas
Cyan=0,240,255,255
Amber=255,190,11,255
White=226,249,255,255
Dim=100,136,164,255

[MeasureTelemetryJSON]
Measure=WebParser
URL=http://127.0.0.1:8000/telemetry
RegExp=(?siU)"status"\s*:\s*"(.*)".*"tool"\s*:\s*"(.*)".*"last_action"\s*:\s*"(.*)".*"updated_at"\s*:\s*"(.*)".*"cpu"\s*:\s*([0-9.]+).*"ram"\s*:\s*([0-9.]+)
UpdateRate=1

[MeasureStatus]
Measure=WebParser
URL=[MeasureTelemetryJSON]
StringIndex=1
Substitute="":"OFFLINE"

[MeasureTool]
Measure=WebParser
URL=[MeasureTelemetryJSON]
StringIndex=2
Substitute="":"NONE"

[MeasureAction]
Measure=WebParser
URL=[MeasureTelemetryJSON]
StringIndex=3
Substitute="":"Sistema Argon 4 en espera..."

[MeasureTime]
Measure=WebParser
URL=[MeasureTelemetryJSON]
StringIndex=4

[MeasureCPU]
Measure=WebParser
URL=[MeasureTelemetryJSON]
StringIndex=5

[MeasureRAM]
Measure=WebParser
URL=[MeasureTelemetryJSON]
StringIndex=6

[MeterBorderTop]
Meter=Shape
Shape=Rectangle 0,0,430,3,0 | Fill Color #Cyan# | StrokeWidth 0

[MeterHeader]
Meter=String
X=16
Y=12
FontFace=#FontTitle#
FontSize=11
FontColor=#Cyan#
FontWeight=800
Text=❖ ARGON 4 // HERMES TELEMETRY HUD
AntiAlias=1

[MeterStatusBadge]
Meter=String
MeasureName=MeasureStatus
X=414
Y=12
StringAlign=Right
FontFace=#FontMono#
FontSize=10
FontColor=#Amber#
Text=[%1]
AntiAlias=1

[MeterMetrics]
Meter=String
MeasureName=MeasureCPU
MeasureName2=MeasureRAM
MeasureName3=MeasureTool
X=16
Y=42
FontFace=#FontMono#
FontSize=10
FontColor=#White#
Text=CPU: %1%   |   RAM: %2%   |   TOOL: %3
AntiAlias=1

[MeterDivider]
Meter=Shape
Shape=Line 16,68,414,68 | StrokeWidth 1 | Stroke Color 0,240,255,70

[MeterLastActionLabel]
Meter=String
MeasureName=MeasureTime
X=16
Y=76
FontFace=#FontMono#
FontSize=8
FontColor=#Dim#
Text=ÚLTIMA ACCIÓN (%1):
AntiAlias=1

[MeterLastActionBody]
Meter=String
MeasureName=MeasureAction
X=16
Y=94
W=398
H=45
ClipString=2
FontFace=#FontMono#
FontSize=9
FontColor=#White#
Text=%1
AntiAlias=1
